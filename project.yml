name: PetTrack
options:
  bundleIdPrefix: com.pettrack
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""   # set your Apple Developer Team ID
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  PetTrack:
    type: application
    platform: iOS
    sources:
      - path: PetTrack
    info:
      path: PetTrack/Info.plist
      properties:
        CFBundleDisplayName: PetTrack
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, es, de, fr, nl]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        CKSharingSupported: true
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: PetTrack uses the camera to scan vet reports and to take photos of your pet.
        NSPhotoLibraryUsageDescription: PetTrack lets you pick photos of your pet and of vet reports.
    entitlements:
      path: PetTrack/PetTrack.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.com.pettrack.app]
        com.apple.developer.icloud-services: [CloudKit]
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pettrack.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    scheme:
      testTargets: [PetTrackTests]
      storeKitConfiguration: Configuration/PetTrack.storekit
  PetTrackTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PetTrackTests]
    dependencies:
      - target: PetTrack
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
